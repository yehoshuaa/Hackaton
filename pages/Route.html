<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Navigation Companion</title>
  <link rel="stylesheet" href="../css/routestyle.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Toggle menu">
          <div>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </button>
        <div>
          <h1>Campus Navigation</h1>
          <p>Route viewer</p>
        </div>
      </div>

      <section class="sidebar-card">
        <h2>Route Details</h2>
        <div class="info-list">
          <div class="info-item">
            <span class="label">Building</span>
            <span class="value" id="buildingLabel">Circus</span>
          </div>
          <div class="info-item">
            <span class="label">Floor</span>
            <span class="value" id="floorLabel">AC1</span>
          </div>
          <div class="info-item">
            <span class="label">Room</span>
            <span class="value" id="roomLabel">AC1.20</span>
          </div>
          <div class="info-item">
            <span class="label">Start</span>
            <span class="value" id="startLabel">Nog niet gestart</span>
          </div>
        </div>
      </section>

      <section class="sidebar-card">
        <h2>Route Types</h2>
        <div class="route-type-list">
          <button class="route-type-btn active" data-route-type="main" type="button">Main route</button>
          <button class="route-type-btn" data-route-type="accessible" type="button">Accessible route</button>
          <button class="route-type-btn" data-route-type="quiet" type="button">Quiet route</button>
        </div>
      </section>

      <section class="sidebar-card legend-card">
        <h2>Legend</h2>
        <div class="legend-row">
          <span class="legend-line main"></span>
          <span>Main route</span>
        </div>
        <div class="legend-row">
          <span class="legend-line accessible"></span>
          <span>Accessible</span>
        </div>
        <div class="legend-row">
          <span class="legend-line quiet"></span>
          <span>Quiet</span>
        </div>
        <div class="legend-row">
          <span class="legend-dot"></span>
          <span>Start point</span>
        </div>
      </section>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="back-btn" type="button" onclick="history.back()"><</button>
          <div>
            <div class="page-kicker">Navigation</div>
            <h2 id="pageTitle">AC1.20</h2>
          </div>
        </div>
      </header>

      <section class="route-panel">
        <div class="map-toolbar">
          <div class="status-chip" id="statusChip">Ready</div>

          <div class="mobile-route-switcher">
            <select id="mobileRouteType">
              <option value="main">Main route</option>
              <option value="accessible">Accessible route</option>
              <option value="quiet">Quiet route</option>
            </select>
          </div>
        </div>

        <div class="canvas-area">
          <div class="canvas-controls">
            <button class="canvas-control-btn" id="zoomOutBtn" type="button">- Zoom Out</button>
            <button class="canvas-control-btn" id="centerBtn" type="button">Center</button>
            <button class="canvas-control-btn" id="zoomInBtn" type="button">+ Zoom In</button>
          </div>

          <div class="canvas-wrapper">
            <canvas id="mapCanvas" class="route-canvas"></canvas>
          </div>
        </div>

        <div class="actions">
          <button class="action-btn primary" id="startRouteBtn" type="button">Start Route</button>
          <button class="action-btn secondary" id="toggleAltRoutesBtn" type="button">Toggle Alternative Route</button>
          <button class="action-btn ghost" id="arrivedBtn" type="button">I Arrived</button>
        </div>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="arrivalModal">
    <div class="modal-card">
      <h3>Arrived</h3>
      <p class="modal-room" id="modalRoomText">Lokaal AC1.20</p>
      <p class="modal-course" id="modalCourseText">Advanced AR 2</p>
      <div class="yippee">Nice work</div>
      <button class="action-btn primary modal-btn" id="closeModalBtn" type="button">Close</button>
    </div>
  </div>

  <script src="../js/routescript.js"></script>
</body>
</html>
